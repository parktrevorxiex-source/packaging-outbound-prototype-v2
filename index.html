eventDialog=function(){modal('模拟应发数量减少','<div class="formrow"><label>出库单号</label><select id="eventId" onchange="updateEventDemand()">'+orders.map(o=>'<option value="'+o.id+'">'+o.id+' / 最新应发 '+latestDemand(o)+'</option>').join('')+'</select></div><div class="formrow"><label>最新应发数量</label><input id="eventQty" type="number" min="0" step="1" value="'+latestDemand(orders[0])+'"></div><div class="info">已出库不超过最新应发时，直接更新应发；超过时保留原应发，按新增应退数量生成独立退料单。只有确认退料入库后才回补库存。</div>','<button class="primary" onclick="applyEvent()">确认更新</button>')};
function updateEventDemand(){$('eventQty').value=latestDemand(get($('eventId').value))}
applyEvent=function(){const o=get($('eventId').value),raw=$('eventQty').value,n=Number(raw),previous=latestDemand(o);if(raw===''||!Number.isInteger(n)||n<0)return toast('应发数量须为非负整数');if(n>=previous)return toast('最新应发须小于当前最新应发，仅支持减少');const closed=state(o)==='已完成';const allocated=returnOrders.filter(r=>r.source===o.id).reduce((sum,r)=>sum+r.expected,0),extra=Math.max(0,o.picked-n-allocated);if(o.picked<=n)o.qty=n;o.latestQty=n;o.closed=closed;if(extra)createReturnOrder(o,extra);log(o,'最新应发数量'+previous+' → '+n,'系统','PMS数量变更');closeModal();render();toast(extra?'应发已更新，新增退料单，应退'+extra+'件':'应发数量已更新，无需退料')};
returnSelected=function(){if(returnSelectedIds.size!==1)return toast('请选择一张退料单');const r=returnOrders.find(x=>returnSelectedIds.has(x.id));if(returnState(r)==='已完成')return toast('该退料单已完成，无需重复入库');activeReturnId=r.id;modal('退料入库','<div class="doc-summary"><span><b>退料单号：</b>'+r.id+'</span><span><b>产品编号：</b>'+get(r.source).product+'</span><span><b>应退/实退：</b>'+r.expected+'/'+r.actual+'</span></div><div class="formrow"><label>退件数量 *</label><input id="returnQty" type="number" min="1" max="'+(r.expected-r.actual)+'" value="'+(r.expected-r.actual)+'"></div><div class="formrow"><label>退回仓库</label><input value="品牌包材仓" readonly></div><div class="info">请确认退料已实际入库，提交后将增加对应仓库库存。</div>','<button class="primary" onclick="confirmReturn()">确认入库</button>')};
confirmReturn=function(){const r=returnOrders.find(x=>x.id===activeReturnId);if(!r)return toast('请重新选择退料单');const n=Number($('returnQty').value);if(!Number.isInteger(n)||n<=0||n>r.expected-r.actual)return toast('退件数量须为正整数且不超过本单待退料数量');const o=get(r.source),unpick=Math.min(n,Math.max(0,o.picked-o.unpicked-o.sent)),back=n-unpick;o.unpicked+=unpick;o.returned+=back;o.received+=back;const receipt={time:now(),user:'王富贵',type:'退料入库',qty:n,location:'品牌包材仓',delta:back};r.receipts.push(receipt);r.actual+=n;o.returns.push(receipt);warehouseStock.set(stockKey(o),(warehouseStock.get(stockKey(o))??0)+n);activeReturnId=null;returnSelectedIds.clear();closeModal();render();toast('退料入库完成')};
orders.forEach(o=>o.lastSnapshot=snapshot(o));

mountReturns();

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});['qvendor','qpo','qproduct'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')search()}));$('navsearch').addEventListener('input',e=>document.querySelectorAll('nav div').forEach(n=>n.style.display=!e.target.value||n.textContent.includes(e.target.value)?'block':'none'));render();
</script></body></html>
